# Optional Tier-2 LLM enrichment. Manual only — never invents flags.
# Requires repo secrets (see README). Skips cleanly when no key is configured.
name: Docs enrich (Tier 2 LLM)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider (openai, xai, gemini, deepseek, anthropic, openrouter, ollama, …)"
        required: false
        default: "openai"
      model:
        description: "Model id override (optional)"
        required: false
        default: ""
      limit:
        description: "Max tools to enrich this run"
        required: false
        default: "25"
      tools:
        description: "Comma-separated tool ids (optional; overrides limit scan)"
        required: false
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve API key
        id: key
        env:
          TOOLHUNT_LLM_API_KEY: ${{ secrets.TOOLHUNT_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          provider="${{ github.event.inputs.provider }}"
          key=""
          case "$provider" in
            openai) key="${OPENAI_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            xai) key="${XAI_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            gemini) key="${GEMINI_API_KEY:-$GOOGLE_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            deepseek) key="${DEEPSEEK_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            anthropic) key="${ANTHROPIC_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            openrouter) key="${OPENROUTER_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            groq) key="${GROQ_API_KEY:-$TOOLHUNT_LLM_API_KEY}" ;;
            *) key="${TOOLHUNT_LLM_API_KEY:-$OPENAI_API_KEY}" ;;
          esac
          if [ -z "$key" ]; then
            echo "No API key secret for provider=$provider — skipping (add a secret; see README)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "api_key=$key" >> "$GITHUB_OUTPUT"
          fi

      - name: Enrich docs
        if: steps.key.outputs.skip != 'true'
        env:
          TOOLHUNT_LLM_PROVIDER: ${{ github.event.inputs.provider }}
          TOOLHUNT_LLM_MODEL: ${{ github.event.inputs.model }}
          TOOLHUNT_LLM_API_KEY: ${{ steps.key.outputs.api_key }}
        run: |
          set -euo pipefail
          args=(--limit "${{ github.event.inputs.limit }}")
          tools="${{ github.event.inputs.tools }}"
          if [ -n "$tools" ]; then
            args=()
            IFS=',' read -ra IDS <<< "$tools"
            for id in "${IDS[@]}"; do
              id="$(echo "$id" | xargs)"
              [ -n "$id" ] && args+=(--tool "$id")
            done
          fi
          python -m docgen.enrich "${args[@]}"

      - name: Open PR if docs changed
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/docs; then
            echo "No doc changes."
            exit 0
          fi
          branch="chore/docs-enrich-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/docs
          git commit -m "chore: Tier-2 LLM doc enrichment (${{ github.event.inputs.provider }})"
          git push -u origin "$branch"
          gh pr create --title "chore: Tier-2 LLM doc enrichment" \
            --body "Automated enrichment via \`docgen.enrich\` (provider=${{ github.event.inputs.provider }}). Flags still come from Tier-1 help — LLM only rewrote descriptions/examples." \
            --base main --head "$branch" || true
